openapi: 3.1.0
info:
  title: RIVALRY 90 Internal & External Proxy API
  version: 1.0.0
  description: Standardized Next.js App Router JSON API for RIVALRY 90 (Phases 11-22).
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Runtime health status
      responses:
        '200':
          description: Service healthy
  /api/health/database:
    get:
      summary: Database health & pool telemetry
      responses:
        '200':
          description: Safe database status
  /api/auth/register:
    post:
      summary: Register account & set r90_session HttpOnly cookie
      responses:
        '201':
          description: Registered
        '409':
          description: Email or username conflict
  /api/auth/login:
    post:
      summary: Sign in with email & password
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
  /api/profile:
    get:
      summary: Retrieve private profile
      responses:
        '200':
          description: Private profile
        '401':
          description: Unauthorized
    patch:
      summary: Update private profile
      responses:
        '200':
          description: Updated
  /api/players:
    get:
      summary: Filter & paginate fictional athletes
      responses:
        '200':
          description: Athlete list
    post:
      summary: Create athlete (players.create permission)
      responses:
        '201':
          description: Created
        '403':
          description: Forbidden
  /api/squads:
    get:
      summary: List current user's saved squads
      responses:
        '200':
          description: Squads list
    post:
      summary: Create squad with server rating hydration
      responses:
        '201':
          description: Squad created
  /api/ai/squad-analysis:
    post:
      summary: Advisory AI squad analysis (owner verified)
      responses:
        '200':
          description: Structured advisory analysis
        '401':
          description: Unauthorized
        '403':
          description: Forbidden for non-owner
  /api/football/competitions:
    get:
      summary: External real-world football competitions (football-data.org v4)
      responses:
        '200':
          description: Competitions or unconfigured empty notice

